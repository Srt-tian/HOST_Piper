# @package _global_
# Paper objective, NOT exact paper temporal sampling or checkpoint continuation.
defaults:
  - piper_3cam_checkpoint_compat
  - _self_

data:
  train:
    use_relative_action: false
    use_augmentation: true
    remove_static_frames: true
    task_video_drop_prob: 0.5
model:
  action_prediction_type: velocity
  video_prediction_type: velocity
  progress_prediction_type: velocity
lr_scheduler_type: constant
learning_rate: 1.0e-5
weight_decay: 1.0e-2
max_grad_norm: 1.0
