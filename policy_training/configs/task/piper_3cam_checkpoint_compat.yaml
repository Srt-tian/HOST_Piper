# @package _global_
defaults:
  - real_joint_2cam_224_1e-4_pac_headwise_ncp_ve
  - override /data: piper_3cam
  - _self_

batch_size: 1
num_workers: 2
model:
  mot_checkpoint_mixed_attn: true
  skip_dit_load_from_pretrain: true
  visual_encoder:
    num_cameras: 3
    backbone_local_repo: ${oc.env:HOST_DINO_REPO}
    backbone_weights_path: ${oc.env:HOST_DINO_WEIGHTS}
    siglip_local_weights_path: ${oc.env:HOST_SIGLIP_WEIGHTS}
resume: ${oc.env:HOST_INIT_CHECKPOINT}
output_dir: ${oc.env:HOST_RUN_DIR}
max_steps: 10000
save_every: 1000
eval_every: 1000
wandb:
  enabled: false
